name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - dist/**
      - site/**
      - scripts/publish_pages.py
      - scripts/build_standalone.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-user-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync docs to SplendidAfternoon.github.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/SplendidAfternoon/SplendidAfternoon.github.io.git" pages
          rsync -a --delete docs/ pages/
          cd pages
          if git status --porcelain | grep -q .; then
            git add -A
            git commit -m "Sync from house-london-seat-67@${GITHUB_SHA::7}"
            git push origin main
          else
            echo "No changes to publish"
          fi
