name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable legacy Pages (main/docs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          body='{"build_type":"legacy","source":{"branch":"main","path":"/docs"}}'

          resp=$(curl -sS -w "\nHTTP_CODE:%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "${body}" "${api}")
          echo "${resp}"
          code="${resp##*HTTP_CODE:}"

          if [ "${code}" = "409" ] || [ "${code}" = "422" ]; then
            curl -sS -f -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "${body}" "${api}"
          elif [ "${code}" != "201" ] && [ "${code}" != "200" ]; then
            echo "Could not enable Pages (HTTP ${code}). Enable manually: Settings → Pages → main → /docs"
            exit 1
          fi

          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
